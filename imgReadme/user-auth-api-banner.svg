<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Consolas','Menlo',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1120"/>
      <stop offset="55%" stop-color="#0D1B30"/>
      <stop offset="100%" stop-color="#122A45"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C464"/>
      <stop offset="100%" stop-color="#D89A2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="keyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2C464" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F2C464" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50%      { opacity: 1;    transform: scale(1.08); }
      }
      @keyframes keyBob {
        0%, 100% { transform: translate(960px,150px) rotate(-18deg) translateY(0px); }
        50%      { transform: translate(960px,150px) rotate(-18deg) translateY(-6px); }
      }
      @keyframes nodePulse {
        0%, 100% { opacity: 0.35; r: 3; }
        50%      { opacity: 1;    r: 4.5; }
      }
      @keyframes sheenSweep {
        0%   { transform: translateX(-140%); }
        100% { transform: translateX(140%); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      .glow-outer { transform-origin: 960px 150px; animation: pulseGlow 4.5s ease-in-out infinite; }
      .glow-inner { transform-origin: 960px 150px; animation: pulseGlow 3.2s ease-in-out infinite 0.4s; }
      .key-mark   { animation: keyBob 5s ease-in-out infinite; }
      .sheen-bar  { animation: sheenSweep 7s linear infinite; }
      .circuit-lines { stroke-dasharray: 4 6; animation: dashFlow 2.2s linear infinite; }
      .node { animation: nodePulse 1.8s ease-in-out infinite; }
      .node:nth-child(2) { animation-delay: 0.2s; }
      .node:nth-child(3) { animation-delay: 0.4s; }
      .node:nth-child(4) { animation-delay: 0.6s; }
      .node:nth-child(5) { animation-delay: 0.8s; }
      .node:nth-child(6) { animation-delay: 1.0s; }
      .node:nth-child(7) { animation-delay: 1.2s; }
      .node:nth-child(8) { animation-delay: 1.4s; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- diagonal light sweep, looping -->
  <g clip-path="url(#clipAll)">
    <rect class="sheen-bar" x="-200" y="-100" width="260" height="600" fill="url(#sheenGrad)" transform="rotate(20 600 150)"/>
  </g>
  <clipPath id="clipAll"><rect width="1200" height="300"/></clipPath>

  <!-- faint circuit / network texture, right two-thirds -->
  <g class="circuit-lines" stroke="#2DD4BF" stroke-width="1" opacity="0.5" fill="none">
    <path d="M 640 40 L 740 40 L 740 90 L 820 90"/>
    <path d="M 700 260 L 780 260 L 780 200 L 900 200"/>
    <path d="M 1000 30 L 1000 80 L 1080 80"/>
    <path d="M 950 250 L 1020 250 L 1020 180"/>
    <path d="M 640 150 L 690 150"/>
  </g>
  <g fill="#2DD4BF">
    <circle class="node" cx="740" cy="40" r="3"/>
    <circle class="node" cx="820" cy="90" r="3"/>
    <circle class="node" cx="780" cy="260" r="3"/>
    <circle class="node" cx="900" cy="200" r="3"/>
    <circle class="node" cx="1000" cy="30" r="3"/>
    <circle class="node" cx="1080" cy="80" r="3"/>
    <circle class="node" cx="1020" cy="180" r="3"/>
    <circle class="node" cx="950" cy="250" r="3"/>
  </g>

  <circle class="glow-outer" cx="960" cy="150" r="190" fill="url(#glow)"/>
  <circle class="glow-inner" cx="960" cy="150" r="130" fill="url(#keyGlow)"/>

  <!-- abstract key mark, gently bobbing -->
  <g class="key-mark" filter="url(#softShadow)">
    <circle cx="-95" cy="0" r="46" fill="none" stroke="url(#keyGrad)" stroke-width="14"/>
    <rect x="-52" y="-9" width="150" height="18" rx="4" fill="url(#keyGrad)"/>
    <rect x="70" y="9" width="16" height="26" fill="url(#keyGrad)"/>
    <rect x="94" y="9" width="16" height="34" fill="url(#keyGrad)"/>
  </g>

  <!-- left text block -->
  <g fill="#E7ECF3">
    <text x="70" y="118" font-size="46" font-weight="700" letter-spacing="0.5">User Auth API</text>
  </g>
  <text x="70" y="152" font-size="16" fill="#93A4BC" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    API REST en Spring Boot · registro, login y control de acceso por roles
  </text>

  <!-- tech badges -->
  <g font-size="13" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="600">
    <g transform="translate(70,190)">
      <rect width="76" height="30" rx="15" fill="none" stroke="#ED8B00" stroke-width="1.4"/>
      <text x="38" y="19" fill="#ED8B00" text-anchor="middle">Java 17</text>
    </g>
    <g transform="translate(158,190)">
      <rect width="112" height="30" rx="15" fill="none" stroke="#6DB33F" stroke-width="1.4"/>
      <text x="56" y="19" fill="#6DB33F" text-anchor="middle">Spring Boot</text>
    </g>
    <g transform="translate(282,190)">
      <rect width="134" height="30" rx="15" fill="none" stroke="#4C8DFF" stroke-width="1.4"/>
      <text x="67" y="19" fill="#4C8DFF" text-anchor="middle">Spring Security</text>
    </g>
    <g transform="translate(428,190)">
      <rect width="64" height="30" rx="15" fill="none" stroke="#B27CE8" stroke-width="1.4"/>
      <text x="32" y="19" fill="#B27CE8" text-anchor="middle">JWT</text>
    </g>
  </g>

  <text x="70" y="256" font-size="13" fill="#5B6D85" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    github.com/JJHernan-dev/user-auth-api
  </text>

  <rect width="1200" height="300" fill="url(#vignette)" pointer-events="none"/>
</svg>
